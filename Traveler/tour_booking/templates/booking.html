{% extends "base.html" %}
{% block title %}Book {{ tour.title }}{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-8">
<div class="card shadow-sm border-0"><div class="card-body p-4 p-md-5">
<h2>Book {{ tour.title }}</h2><p class="text-muted">৳{{ '%.2f'|format(tour.price) }} per person • {{ tour.available_seats }} seats available</p>
<form method="POST" id="bookingForm" data-price="{{ tour.price }}">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="customer_name" value="{{ current_user.full_name }}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="customer_email" value="{{ current_user.email }}"></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="customer_phone" value="{{ current_user.phone or '' }}" required></div>
<div class="col-md-6"><label class="form-label">Number of Persons</label><input class="form-control" id="totalPersons" type="number" name="total_persons" min="1" max="{{ tour.available_seats }}" value="1" required></div>
<div class="col-12"><label class="form-label">Special Request</label><textarea class="form-control" name="special_request" rows="3"></textarea></div>
</div>
<div class="alert alert-light border mt-4 mb-3">Estimated total: <strong id="bookingTotal">৳{{ '%.2f'|format(tour.price) }}</strong></div>
<button class="btn btn-primary btn-lg w-100">Confirm Booking</button>
</form>
</div></div></div></div></div>
{% endblock %}
